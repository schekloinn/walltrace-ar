name: Build Puffline IPA
"on":
  push:
    branches: [puffline-ios15]
    paths: ["App/**", "Shared/**", "Widget/**", "Tests/**", "scripts/**", "project.yml", ".github/workflows/build-ipa.yml"]
permissions:
  contents: read
concurrency:
  group: puffline-ipa
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project generator
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen; fi
      - name: Check, build, sign and validate IPA
        run: bash scripts/build-ipa.sh
      - name: Upload installable IPA
        uses: actions/upload-artifact@v4
        with:
          name: Puffline-1.0-IPA
          path: |
            build/Puffline-1.0.ipa
            build/Puffline-1.0.ipa.sha256
            build/package-validation.json
            build/checks.log
            build/toolchain.txt
            build/app-entitlements.plist
            build/widget-entitlements.plist
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Puffline-build-diagnostics
          path: |
            build/build.log
            build/checks.log
            build/toolchain.txt
            Puffline.xcodeproj
          if-no-files-found: warn
          retention-days: 7
