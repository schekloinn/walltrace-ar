name: WallTraceAR
options:
  bundleIdPrefix: local.walltrace
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_BITCODE: "NO"
    SUPPORTS_MACCATALYST: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: "NO"
targets:
  WallTraceAR:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: WallTraceAR
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: WallTrace AR
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: local.walltrace.ar
        INFOPLIST_FILE: WallTraceAR/Info.plist
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
    dependencies:
      - sdk: ARKit.framework
      - sdk: SceneKit.framework
      - sdk: AVFoundation.framework
      - sdk: ImageIO.framework
      - sdk: UniformTypeIdentifiers.framework
schemes:
  WallTraceAR:
    build:
      targets:
        WallTraceAR: all
    run:
      config: Debug
    archive:
      config: Release
