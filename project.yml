name: Puffline
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_BITCODE: "NO"
    SUPPORTS_MACCATALYST: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Puffline:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_NAME: Puffline
        PRODUCT_BUNDLE_IDENTIFIER: local.puffline.app
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Puffline.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PufflineWidget
      - sdk: WidgetKit.framework
      - sdk: UserNotifications.framework
  PufflineWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.puffline.app.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Puffline.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
schemes:
  Puffline:
    build:
      targets:
        Puffline: all
    run:
      config: Debug
    archive:
      config: Release
