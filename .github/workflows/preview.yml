name: Puffline simulator preview
"on":
  push:
    branches: [puffline-ios15]
    paths: ["App/**", "Shared/**", "Widget/**", "Tests/**", "scripts/**", "project.yml", ".github/workflows/preview.yml"]
permissions:
  contents: read
concurrency:
  group: puffline-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and check
        run: |
          set -euo pipefail
          mkdir -p build/previews
          xcodebuild -version | tee build/toolchain.txt
          if ! command -v xcodegen >/dev/null 2>&1; then HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen; fi
          xcrun swiftc -O -swift-version 5 Shared/Model.swift Tests/Checks.swift -o build/checks
          build/checks | tee build/checks.log
          xcrun swift scripts/icon.swift
          xcodegen generate
      - name: Build simulator only — no IPA
        run: |
          set -euo pipefail
          xcodebuild -project Puffline.xcodeproj -scheme Puffline -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES build 2>&1 | tee build/build.log
      - name: Capture real app screens
        run: bash scripts/preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Puffline-preview
          path: |
            build/previews
            build/checks.log
            build/toolchain.txt
            build/build.log
          retention-days: 7
